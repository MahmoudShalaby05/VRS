<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveRed | My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="font-inter bg-gray-50 text-gray-900">
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16">
        <section class="profile-hero">
            <div class="profile-avatar-wrap">
                <img id="profileAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=drivered-user" alt="Profile image" class="profile-avatar">
                <input id="profilePhotoInput" type="file" accept="image/*" class="hidden">
                <button id="changePhotoBtn" class="profile-photo-btn">Change photo</button>
            </div>
            <div>
                <p class="text-sm uppercase tracking-[0.2em] text-gray-500">My account</p>
                <h1 id="profileName" class="text-3xl md:text-4xl font-black mt-2">Loading...</h1>
                <p id="profileEmail" class="text-gray-500 mt-2">-</p>
                <p id="profilePhone" class="text-gray-500">-</p>
            </div>
        </section>

        <section class="grid md:grid-cols-3 gap-4 mt-6">
            <article class="profile-stat-card">
                <p class="text-sm text-gray-500">Total bookings</p>
                <p id="bookingsCount" class="text-3xl font-black mt-1">0</p>
            </article>
            <article class="profile-stat-card">
                <p class="text-sm text-gray-500">Damage reports</p>
                <p id="damageCount" class="text-3xl font-black mt-1">0</p>
            </article>
            <article class="profile-stat-card">
                <p class="text-sm text-gray-500">Joined</p>
                <p id="joinedAt" class="text-xl font-bold mt-2">-</p>
            </article>
        </section>

        <section class="mt-8 grid lg:grid-cols-2 gap-6">
            <article class="profile-panel">
                <div class="panel-header">
                    <h2>Vehicle Booking History</h2>
                </div>
                <div id="bookingHistoryList" class="space-y-3"></div>
            </article>

            <article class="profile-panel">
                <div class="panel-header">
                    <h2>Damage Reports</h2>
                </div>
                <div id="damageReportsList" class="space-y-3"></div>
            </article>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
